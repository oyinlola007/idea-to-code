# Career Manager: overview of every feature and how they feed each other.
# DRAFT written for the ITC-2 spike; the founder still has to review it.
project: Career Manager
description: Open-source app to manage a career end to end, from job search to promotion.

features:
  - id: career-profile
    label: Career profile and job overview
    description: One profile of experiences, skills and goals that every other feature reads from.
  - id: job-search
    label: Job search and tailored applications
    description: Find jobs, then produce a tailored CV, cover letter and form answers per application.
  - id: application-tracker
    label: Application tracker
    description: Every application with its status, documents and next step.
  - id: interview-prep
    label: Interview prep
    description: Practice interviews using stories built from your own experiences.
  - id: career-growth
    label: Achievements and promotion prep
    description: After starting a job, log achievements and prepare appraisals and promotion cases.
  - id: email-integration
    label: Email integration
    description: Picks up application emails and updates the tracker automatically.

# Shared building blocks that several features use.
components:
  - id: app-database
    label: App database
    kind: database
    tech: PostgreSQL
  - id: llm-api
    label: LLM API
    kind: external-api
    tech: Claude API

connections:
  - from: career-profile
    to: job-search
    data: "experiences, skills, goals"
  - from: job-search
    to: application-tracker
    data: "application record (job, CV version, cover letter)"
  - from: email-integration
    to: application-tracker
    data: status update from email
  - from: career-profile
    to: interview-prep
    data: experiences for STAR stories
  - from: application-tracker
    to: interview-prep
    data: interview scheduled
  - from: application-tracker
    to: career-growth
    data: offer accepted
  - from: career-growth
    to: career-profile
    data: new achievements
  - from: job-search
    to: llm-api
    data: job description + profile
