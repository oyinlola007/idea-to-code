# Job search: from finding a job to a submitted, tailored application.
feature: job-search
flows:
  main:
    label: Job search and tailored applications
    nodes:
      - id: start-job-search
        type: start
        label: Open job search
      - id: search-jobs
        type: step
        label: Search jobs
        description: Search by role, location (Paris or remote in Europe) and seniority. v1 is manual search plus pasting a job link; job board APIs come later.
        status: done
      - id: save-job
        type: step
        label: Save job and description
        status: done
      - id: good-fit
        type: decision
        label: Good fit?
      - id: archive-job
        type: step
        label: Archive job
      - id: tailor-cv
        type: step
        label: Tailor CV
        description: One CV per application, generated from the profile and the job description.
        expands: tailor-cv-flow
      - id: needs-cover-letter
        type: decision
        label: Cover letter required?
      - id: write-cover-letter
        type: step
        label: Write cover letter
        description: Only when the application asks for one.
      - id: form-help
        type: step
        label: Answer application-form questions
        expands: form-help-flow
      - id: submit-application
        type: step
        label: Submit application
      - id: application-sent
        type: end
        label: Application sent
      # Hands the application over to the tracker feature.
      - id: to-tracker
        type: reference
        label: Track the application
        ref: application-tracker
    edges:
      - from: start-job-search
        to: search-jobs
      - from: search-jobs
        to: save-job
      - from: save-job
        to: good-fit
      - from: good-fit
        to: archive-job
        label: "no"
      - from: good-fit
        to: tailor-cv
        label: "yes"
      - from: tailor-cv
        to: needs-cover-letter
      - from: needs-cover-letter
        to: write-cover-letter
        label: "yes"
      - from: needs-cover-letter
        to: form-help
        label: "no"
      - from: write-cover-letter
        to: form-help
      - from: form-help
        to: submit-application
      - from: submit-application
        to: application-sent
      - from: submit-application
        to: to-tracker
        data: application record

  tailor-cv-flow:
    label: Tailor CV
    nodes:
      - id: parse-job
        type: step
        label: Extract requirements from the job description
        status: done
      - id: match-profile
        type: step
        label: Match profile experiences to requirements
        status: in_progress
      - id: pick-template
        type: step
        label: Pick CV template
        expands: pick-template-flow
      - id: generate-cv
        type: step
        label: Generate tailored CV
      - id: cv-llm
        type: reference
        label: LLM API
        ref: llm-api
      - id: review-cv
        type: step
        label: Review and edit CV
      - id: export-cv
        type: step
        label: Export PDF and Word
      # Every generated CV is kept so the tracker can show which version was sent.
      - id: cv-versions
        type: component
        kind: storage
        tech: Local files
        label: CV versions
    edges:
      - from: parse-job
        to: match-profile
        data: requirements list
      - from: match-profile
        to: pick-template
      - from: pick-template
        to: generate-cv
        data: template + matched experiences
      - from: generate-cv
        to: cv-llm
        data: prompt with job and profile
      - from: cv-llm
        to: review-cv
        data: draft CV
      - from: review-cv
        to: export-cv
      - from: export-cv
        to: cv-versions
        data: CV file + version

  pick-template-flow:
    label: Pick CV template
    nodes:
      - id: list-templates
        type: step
        label: Show available templates
        status: done
      - id: uses-ats
        type: decision
        label: Applying through an ATS?
      - id: suggest-simple
        type: step
        label: Suggest a single-column ATS template
      - id: suggest-designed
        type: step
        label: Suggest a designed template
      - id: preview-template
        type: step
        label: Preview with my data
    edges:
      - from: list-templates
        to: uses-ats
      - from: uses-ats
        to: suggest-simple
        label: "yes"
      - from: uses-ats
        to: suggest-designed
        label: "no"
      - from: suggest-simple
        to: preview-template
      - from: suggest-designed
        to: preview-template

  form-help-flow:
    label: Answer application-form questions
    nodes:
      - id: paste-questions
        type: step
        label: Paste the form questions
      - id: draft-answers
        type: step
        label: Draft answers from the profile
      - id: form-llm
        type: reference
        label: LLM API
        ref: llm-api
      - id: review-answers
        type: step
        label: Review and copy answers
    edges:
      - from: paste-questions
        to: draft-answers
      - from: draft-answers
        to: form-llm
        data: questions + profile
      - from: form-llm
        to: review-answers
        data: draft answers
