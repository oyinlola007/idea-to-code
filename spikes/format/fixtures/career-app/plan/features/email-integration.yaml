# Email integration: system design for picking up application emails.
feature: email-integration
flows:
  main:
    label: Email integration
    description: Read-only access to the inbox; emails are classified and turned into tracker updates.
    nodes:
      - id: connect-account
        type: step
        label: Connect email account
        expands: connect-flow
      - id: email-provider
        type: component
        kind: external-api
        tech: Gmail API
        label: Email provider
      - id: sync-worker
        type: component
        kind: server
        tech: Background job
        label: Sync worker
      # v1 keeps the queue in process; swap for a real queue if sync volume grows.
      - id: email-queue
        type: component
        kind: queue
        tech: In-process queue
        label: Email queue
      - id: email-classifier
        type: component
        kind: service
        tech: Rules + LLM
        label: Email classifier
        expands: classify-flow
      - id: email-db
        type: reference
        label: App database
        ref: app-database
      - id: email-to-tracker
        type: reference
        label: Application tracker
        ref: application-tracker
    edges:
      - from: connect-account
        to: sync-worker
        data: OAuth token
      - from: email-provider
        to: sync-worker
        data: new emails
      - from: sync-worker
        to: email-queue
        data: raw email
      - from: email-queue
        to: email-classifier
        data: raw email
      - from: email-classifier
        to: email-db
        data: classified event
      - from: email-db
        to: email-to-tracker
        data: status update

  connect-flow:
    label: Connect email account
    nodes:
      - id: start-connect
        type: start
        label: Start
      - id: pick-provider
        type: step
        label: Choose provider (Gmail first)
        status: done
      - id: oauth-consent
        type: step
        label: OAuth consent
        description: Read-only scope only; the app never sends email.
        status: in_progress
      - id: consent-granted
        type: decision
        label: Consent granted?
      - id: store-token
        type: step
        label: Store the token encrypted
      - id: explain-retry
        type: step
        label: Explain why and offer to retry
      - id: connected
        type: end
        label: Connected
    edges:
      - from: start-connect
        to: pick-provider
      - from: pick-provider
        to: oauth-consent
      - from: oauth-consent
        to: consent-granted
      - from: consent-granted
        to: store-token
        label: "yes"
      - from: consent-granted
        to: explain-retry
        label: "no"
      - from: store-token
        to: connected

  classify-flow:
    label: Classify email
    nodes:
      - id: filter-job-emails
        type: step
        label: Filter likely job emails (sender and subject rules)
      - id: about-application
        type: decision
        label: About an application?
      - id: ignore-email
        type: step
        label: Ignore
      - id: match-application
        type: step
        label: Match to a tracked application
      - id: extract-status
        type: step
        label: "Extract status (received, interview, rejection, offer)"
      - id: classify-llm
        type: reference
        label: LLM API
        ref: llm-api
    edges:
      - from: filter-job-emails
        to: about-application
      - from: about-application
        to: ignore-email
        label: "no"
      - from: about-application
        to: match-application
        label: "yes"
      - from: match-application
        to: extract-status
      - from: extract-status
        to: classify-llm
        data: email text
